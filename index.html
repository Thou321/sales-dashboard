<style>
:root {
  --bg: #020616;
  --panel-bg: rgba(12, 20, 55, 0.92);
  --border: rgba(64, 158, 255, 0.18);
  --border-glow: rgba(64, 158, 255, 0.55);
  --text: #e2ecff;
  --text-dim: #8ba4d0;
  --text-muted: #4a6090;
  --cyan: #00d4ff;
  --blue: #409eff;
  --purple: #a855f7;
  --green: #00e676;
  --amber: #ffb300;
  --rose: #ff5252;
  --font: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
body {
  font-family: var(--font); color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* ---- Animated BG ---- */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 40% at 15% 25%, rgba(64,158,255,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 50% 35% at 85% 25%, rgba(168,85,247,0.10) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 55% 75%, rgba(0,212,255,0.07) 0%, transparent 60%),
    repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(64,158,255,0.015) 2px, rgba(64,158,255,0.015) 4px);
  animation: bgPulse 8s ease-in-out infinite;
}
@keyframes bgPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

/* ---- Screen Layout ---- */
.screen { position: relative; z-index: 1; width: 100%; height: 100%; display: flex; flex-direction: column; }
.top-bar {
  height: 68px; min-height: 68px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 36px; position: relative;
  background: linear-gradient(180deg, rgba(12,20,55,0.95) 0%, transparent 100%);
  border-bottom: 1px solid var(--border);
}
.top-bar::after {
  content: ""; position: absolute; bottom: 0; left: 36px; right: 36px;
  height: 2px; background: linear-gradient(90deg, transparent, var(--cyan), var(--blue), var(--purple), transparent);
  animation: scanLine 3s ease-in-out infinite;
}
@keyframes scanLine { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
.top-bar h1 {
  font-size: 28px; font-weight: 900; letter-spacing: 3px;
  background: linear-gradient(90deg, #60c0ff, #409eff, #a855f7);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 20px rgba(64,158,255,0.4));
}
.top-meta { display: flex; gap: 14px; align-items: center; }
.top-pill {
  font-size: 12px; padding: 5px 16px; border-radius: 3px;
  border: 1px solid var(--border); color: var(--text-dim);
  letter-spacing: 1px; white-space: nowrap;
  background: rgba(12,20,55,0.6); backdrop-filter: blur(4px);
}

/* ---- Body Grid ---- */
.body-grid {
  flex: 1; display: grid;
  grid-template-columns: 310px 1fr 330px;
  gap: 10px; padding: 10px 16px 12px;
  min-height: 0;
}

/* ---- Panel ---- */
.panel {
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: 2px;
  position: relative; overflow: hidden;
  backdrop-filter: blur(6px);
  transition: border-color 0.3s;
}
.panel:hover { border-color: var(--border-glow); }
.panel::before {
  content: ""; position: absolute; top: 0; left: 0; width: 16px; height: 16px; z-index: 3;
  border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan);
  opacity: 0.5; pointer-events: none;
}
.panel::after {
  content: ""; position: absolute; top: 0; right: 0; width: 16px; height: 16px; z-index: 3;
  border-top: 2px solid var(--purple); border-right: 2px solid var(--purple);
  opacity: 0.5; pointer-events: none;
}
.panel-inner::before {
  content: ""; position: absolute; bottom: 0; left: 0; width: 16px; height: 16px; z-index: 3;
  border-bottom: 2px solid var(--purple); border-left: 2px solid var(--purple);
  opacity: 0.5; pointer-events: none;
}
.panel-inner::after {
  content: ""; position: absolute; bottom: 0; right: 0; width: 16px; height: 16px; z-index: 3;
  border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan);
  opacity: 0.5; pointer-events: none;
}
.panel-title {
  font-size: 14px; font-weight: 700; color: var(--text);
  padding: 14px 18px 0; letter-spacing: 1.5px;
  display: flex; align-items: center; gap: 10px;
}
.panel-title::before {
  content: ""; width: 4px; height: 16px;
  background: linear-gradient(180deg, var(--cyan), var(--blue), var(--purple));
  border-radius: 2px; animation: titleGlow 2s ease-in-out infinite;
}
@keyframes titleGlow { 0%, 100% { box-shadow: 0 0 8px var(--cyan); } 50% { box-shadow: 0 0 16px var(--purple); } }
.panel-body { padding: 10px 18px 16px; height: calc(100% - 40px); }

/* ---- Left Column ---- */
.left-col { display: flex; flex-direction: column; gap: 10px; }
.left-col .panel { min-height: 0; }
.dp-kpi-ring { display: flex; align-items: center; gap: 18px; height: 100%; }
.dp-ring-wrap { width: 76px; height: 76px; flex-shrink: 0; position: relative; }
.dp-ring-wrap svg { width: 76px; height: 76px; }
.dp-ring-num {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-size: 18px; font-weight: 900; line-height: 1;
}
.dp-ring-num small { font-size: 9px; font-weight: 500; color: var(--text-muted); }
.dp-kpi-info { flex: 1; min-width: 0; }
.dp-kpi-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
.dp-kpi-row .lbl { color: var(--text-dim); }
.dp-kpi-row .val { font-weight: 700; }
.progress-label { font-size: 10px; color: var(--text-muted); margin-top: 3px; }

/* Category mini */
.cat-mini { display: flex; align-items: center; gap: 9px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
.cat-mini:last-child { border-bottom: none; }
.cat-mini-icon { font-size: 20px; width: 26px; text-align: center; flex-shrink: 0; }
.cat-mini-info { flex: 1; min-width: 0; font-size: 11px; }
.cat-mini-name { display: flex; justify-content: space-between; margin-bottom: 3px; }
.cat-mini-name .nm { font-weight: 600; }
.cat-mini-bar { height: 4px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; margin-bottom: 2px; }
.cat-mini-fill { height: 100%; border-radius: 2px; transition: width 1s cubic-bezier(0.4,0,0.2,1); position: relative; }
.cat-mini-fill::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 20px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3)); }
.cat-mini-sub { font-size: 9px; color: var(--text-muted); }

/* ---- Center ---- */
.center-col { display: flex; flex-direction: column; gap: 10px; }
.charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; min-height: 0; }
.charts-row .panel { min-height: 0; }
.chart-box { width: 100%; height: 100%; position: relative; }

/* ---- Right ---- */
.right-col { display: flex; flex-direction: column; gap: 10px; }
.right-col .panel { min-height: 0; }

/* Channel mini */
.ch-mini { display: flex; align-items: center; gap: 9px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
.ch-mini:last-child { border-bottom: none; }
.ch-mini-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 6px currentColor; }
.ch-mini-info { flex: 1; min-width: 0; font-size: 11px; }
.ch-mini-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
.ch-mini-top .nm { font-weight: 700; }
.ch-mini-bar { height: 4px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; }
.ch-mini-fill { height: 100%; border-radius: 2px; transition: width 1s cubic-bezier(0.4,0,0.2,1); position: relative; }
.ch-mini-fill::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 16px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25)); }

/* ---- Table ---- */
.table-scroll { overflow-y: auto; max-height: 100%; }
.table-scroll::-webkit-scrollbar { width: 3px; }
.table-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
table { width: 100%; border-collapse: collapse; font-size: 10px; }
thead th {
  position: sticky; top: 0; z-index: 1;
  background: rgba(12,20,55,0.98); color: var(--text-dim);
  padding: 7px 8px; text-align: center; border-bottom: 1px solid var(--border);
  font-weight: 600; font-size: 10px; white-space: nowrap; letter-spacing: 0.5px;
}
td { padding: 5px 8px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.02); font-size: 10px; }
td.name-cell { text-align: left; font-weight: 600; }
tr:hover td { background: rgba(64,158,255,0.05); }
tr.total-row td { font-weight: 700; background: rgba(64,158,255,0.08); border-bottom: 1px solid rgba(64,158,255,0.15); }

/* ---- Filter ---- */
.filter-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 6px; align-items: center; }
.filter-label { font-size: 10px; color: var(--text-muted); flex-shrink: 0; padding-top: 3px; }
.filter-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.filter-tag {
  padding: 3px 10px; border-radius: 2px; border: 1px solid var(--border);
  background: transparent; color: var(--text-dim); font-size: 10px;
  cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.filter-tag:hover { border-color: var(--cyan); color: var(--text); }
.filter-tag.active { background: rgba(0,212,255,0.12); border-color: var(--cyan); color: var(--cyan); }

/* ---- Animation ---- */
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.anim { animation: fadeIn 0.6s ease-out both; }
.anim-d1 { animation-delay: 0s; }
.anim-d2 { animation-delay: 0.1s; }
.anim-d3 { animation-delay: 0.2s; }
.anim-d4 { animation-delay: 0.3s; }
@keyframes glowPulse { 0%, 100% { filter: drop-shadow(0 0 4px var(--cyan)); } 50% { filter: drop-shadow(0 0 12px var(--cyan)); } }
.glow { animation: glowPulse 3s ease-in-out infinite; }
</style>
</head>

// Ring SVG helper
function ringSvg(pct, colorStop1, colorStop2, size) {
  const r = size || 28, circ = 2 * Math.PI * r;
  const d = (size || 28) * 2 + 8;
  const offset = circ * (1 - Math.min(pct, 100) / 100);
  const id = 'g' + pad2(Math.floor(pct * 999 % 99));
  return `<svg viewBox="0 0 ${d} ${d}">
    <circle cx="${d/2}" cy="${d/2}" r="${r}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="3"/>
    <circle cx="${d/2}" cy="${d/2}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="3"
      stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"
      stroke-linecap="round" transform="rotate(-90 ${d/2} ${d/2})"/>
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="${colorStop1}"/><stop offset="100%" stop-color="${colorStop2}"/>
    </linearGradient></defs>
  </svg>`;
}

      <div class="cat-mini-name"><span class="nm">${cat}</span><span style="font-weight:700;color:${color}">${fmtR2(rate)}</span></div>
      <div class="cat-mini-bar"><div class="cat-mini-fill" style="width:${Math.min(rate,100)}%;background:${color}"></div></div>
      <div class="cat-mini-sub">${fmtY(d.actual_amount)} / ${fmtY(d.target_amount)} · 利润 ${fmtR(d.profit_rate)}</div>
    </div>`;
  catGrid.appendChild(card);
});

// ===== CHANNEL CARDS =====
// 渠道分组（仅前端展示，不动数据）
const channelGroups = {
  PDD: ['PDD嘉合', 'PDD华硕', 'PDD铭瑄', 'AOC'],
  淘系: ['闲鱼', '淘宝'],
  抖音: ['抖音嘉合', '抖音三超', '抖音速睿达'],
};
const allChannels = Object.keys(channelGroups);
const allOperators = [...new Set(DATA.channels.map(ch => ch.operator))];
let filterChannel = '全部';
let filterOperator = '全部';

function renderFilterBar() {
  // 渠道筛选（按分组展示）
  const chRow = document.getElementById('filterChRow');
  chRow.innerHTML = '<span class="filter-label">渠道</span>';
  const chTags = document.createElement('div');
  chTags.className = 'filter-tags';
  ['全部', ...allChannels].forEach(name => {
    const tag = document.createElement('span');
    tag.className = 'filter-tag' + (filterChannel === name ? ' active' : '');
    tag.textContent = name;
    tag.onclick = () => { filterChannel = name; filterOperator = '全部'; renderFilterBar(); renderChannelCards(); };
    chTags.appendChild(tag);
  });
  chRow.appendChild(chTags);
  // 运营筛选
  const opRow = document.getElementById('filterOpRow');
  opRow.innerHTML = '<span class="filter-label">运营</span>';
  const opTags = document.createElement('div');
  opTags.className = 'filter-tags';
  ['全部', ...allOperators].forEach(name => {
    const tag = document.createElement('span');
    tag.className = 'filter-tag' + (filterOperator === name ? ' active' : '');
    tag.textContent = name;
    tag.onclick = () => { filterOperator = name; filterChannel = '全部'; renderFilterBar(); renderChannelCards(); };
    opTags.appendChild(tag);
  });
  opRow.appendChild(opTags);
}

function renderChannelCards() {
  const chGrid = document.getElementById('chGrid');
  chGrid.innerHTML = '';
  const filtered = DATA.channels.filter(ch => {
    if (filterChannel !== '全部' && !channelGroups[filterChannel].includes(ch.name)) return false;
    if (filterOperator !== '全部' && ch.operator !== filterOperator) return false;
    return true;
  });
  filtered.forEach(ch => {
    const color = barColor(ch.amount_rate);
    const card = document.createElement('div');
    card.className = 'ch-mini';
    card.innerHTML = `
      <div class="ch-mini-dot" style="background:${color}"></div>
      <div class="ch-mini-info">
        <div class="ch-mini-top">
          <span class="nm">${ch.name}</span>
          <span style="font-size:9px;color:var(--text-muted)">${ch.operator}</span>
          <span style="font-weight:700;color:${color};font-size:10px">${fmtR2(ch.amount_rate)}</span>
        </div>
        <div class="ch-mini-bar"><div class="ch-mini-fill" style="width:${Math.min(ch.amount_rate,100)}%;background:${color}"></div></div>
        <div style="font-size:9px;color:var(--text-muted);margin-top:1px">${fmtY(ch.actual_amount)} / ${fmtY(ch.target_amount)} · 利润 ${fmtR(ch.profit_rate)}</div>
      </div>`;
    chGrid.appendChild(card);
  });
}

renderFilterBar();
renderChannelCards();

// ===== DETAIL TABLE =====
const tbody = document.getElementById('tableBody');
DATA.channels.forEach(ch => {
  let hasData = false;
  DATA.categories.forEach(cat => {
    const d = ch.categories[cat];
    if (d.target_amount === 0 && d.actual_amount === 0) return;
    hasData = true;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="name-cell">${ch.name}</td>
      <td>${catIcons[cat]||''} ${cat}</td>
      <td>${fmtY(d.target_amount)}</td>
      <td>${fmtY(d.actual_amount)}</td>
      <td style="color:${barColor(d.amount_rate)};font-weight:600">${fmtR2(d.amount_rate)}</td>
      <td style="color:${d.profit_rate<0?'var(--rose)':barColor(Math.abs(d.profit_rate))}">${fmtR(d.profit_rate)}</td>`;
    tbody.appendChild(tr);
  });
  if (hasData) {
    const tr = document.createElement('tr');
    tr.className = 'total-row';
    tr.innerHTML = `
      <td class="name-cell">${ch.name} 合计</td>
      <td>-</td>
      <td>${fmtY(ch.target_amount)}</td>
      <td>${fmtY(ch.actual_amount)}</td>
      <td style="color:${barColor(ch.amount_rate)}">${fmtR2(ch.amount_rate)}</td>
      <td style="color:${ch.profit_rate<0?'var(--rose)':barColor(Math.abs(ch.profit_rate))}">${fmtR(ch.profit_rate)}</td>`;
    tbody.appendChild(tr);
  }
});

</script>
<!-- ========== 登录鉴权 ========== -->
<script>
// 密码 SHA256 哈希（不存储明文）
var AUTH_HASH = '189c4bb71400c9818638cecfdaf1d96dc32c6f7364eb675dcaf4ff8eb2eb667f';

(function(){
  if (sessionStorage.getItem('dashboard_auth') === 'ok') {
    document.getElementById('login-overlay').style.display = 'none';
  }
})();

async function doLogin() {
  var pwd = document.getElementById('login-pwd').value.trim();
  if (!pwd) return;
  var data = new TextEncoder().encode(pwd);
  var hashBuffer = await crypto.subtle.digest('SHA-256', data);
  var hashArray = Array.from(new Uint8Array(hashBuffer));
  var hash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  if (hash === AUTH_HASH) {
    sessionStorage.setItem('dashboard_auth', 'ok');
    document.getElementById('login-overlay').style.display = 'none';
    document.getElementById('login-err').style.display = 'none';
  } else {
    document.getElementById('login-err').style.display = 'block';
    document.getElementById('login-pwd').value = '';
    document.getElementById('login-pwd').focus();
    var overlay = document.getElementById('login-overlay').children[0];
    overlay.style.animation = 'none';
    overlay.offsetHeight;
    overlay.style.animation = 'shake 0.5s ease';
  }
}

</script>
<style>
@keyframes shake {
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(4px)}
}
</style>
<!-- ========== /登录鉴权 ========== -->
</body>
