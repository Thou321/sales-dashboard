<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>嘉合伟业 · 销售数据中心</title>
<style>
:root {
  --bg: #060613;
  --panel-bg: rgba(15,15,35,0.9);
  --border: rgba(255,255,255,0.08);
  --text: #e8ecf1;
  --text-dim: #8892a4;
  --accent: #6366f1;
  --accent2: #8b5cf6;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
body { display:flex; flex-direction:column; }

/* Nav */
.nav {
  height:50px; min-height:50px;
  display:flex; align-items:center; gap:8px;
  padding:0 20px;
  background:var(--panel-bg);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(10px);
  z-index:100;
}
.nav-logo {
  font-size:16px; font-weight:800; letter-spacing:1px;
  background:linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  margin-right:16px;
}
.nav-tab {
  padding:6px 18px; border-radius:8px; font-size:13px; font-weight:600;
  cursor:pointer; border:1px solid transparent; transition:all 0.2s;
  color:var(--text-dim); user-select:none; letter-spacing:0.5px;
}
.nav-tab:hover { color:var(--text); border-color:var(--border); }
.nav-tab.active {
  background:linear-gradient(135deg, rgba(99,102,241,0.15), rgba(139,92,246,0.1));
  border-color:var(--accent); color:var(--accent);
}

/* Content */
.content { flex:1; position:relative; overflow:hidden; }
.content iframe { position:absolute; inset:0; width:100%; height:100%; border:none; display:none; }
.content iframe.active { display:block; }
</style>
</head>
<body>
<nav class="nav">
  <span class="nav-logo">嘉合伟业</span>
  <span class="nav-tab active" data-page="dashboard">📊 实时看板</span>
  <span class="nav-tab" data-page="review">📈 数据复盘</span>
</nav>
<div class="content">
  <iframe class="active" src="7月销售目标看板.html" data-page="dashboard"></iframe>
  <iframe src="7月销售数据复盘.html" data-page="review"></iframe>
</div>
<script>
document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const page = tab.dataset.page;
    document.querySelectorAll('.content iframe').forEach(f => {
      f.classList.toggle('active', f.dataset.page === page);
    });
  });
});
</script>
</body>
</html>
